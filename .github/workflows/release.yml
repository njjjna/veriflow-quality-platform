name: Verify and publish v0.3.4
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veriflow-release-v0.3.4
  cancel-in-progress: false
jobs:
  verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          pip install -r requirements.txt -r requirements-test.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify backend and frontend regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/release-checks
          pytest -q | tee test-artifacts/release-checks/pytest.txt
          node --check app/static/app.js
          node --test tests/frontend_release.test.cjs | tee test-artifacts/release-checks/frontend.txt
      - name: Verify real Chromium and HTTP acceptance
        run: python scripts/run_isolated_uat.py --suite all --output test-artifacts/release-run
      - name: Retain evidence and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_verified_release.py
      - name: Retain run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-v0.3.4-release-diagnostics
          path: |
            test-artifacts/release-checks/
            test-artifacts/release-run/
            dist/
          retention-days: 14
