name: Isolated Chromium UAT
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and Playwright
        run: |
          pip install -r requirements.txt -r requirements-test.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run API and browser suites with separate fresh databases
        run: python scripts/run_isolated_uat.py --suite all
      - name: Upload reports, screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-isolated-uat-${{ github.sha }}
          path: test-artifacts/isolated/
          if-no-files-found: error
          retention-days: 14
