# Example for local PostgreSQL evaluation. NOT a ready-to-expose production deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: veriflow
      POSTGRES_DB: veriflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriflow -d veriflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://veriflow:${POSTGRES_PASSWORD}@db:5432/veriflow
      COOKIE_SECURE: "false"
      VERIFLOW_MODE: "demo"       # database type does NOT make this production-safe
      VERIFLOW_UPLOAD_DIR: /data/uploads
volumes:
  postgres_data:
